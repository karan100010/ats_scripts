version: "3.8"

networks:
  net:
    driver: bridge

services:
  nemo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    container_name: nemo-en
    deploy:
      resources:
        limits:
          cpus: "0.1"
    volumes:
      - /fra/KARAN  # Mount a host directory with sufficient space
    environment:
      - TMPDIR=/fra/KARAN             # Set temporary directory to the mounted volume

